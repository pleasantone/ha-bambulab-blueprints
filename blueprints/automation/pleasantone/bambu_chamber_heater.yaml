blueprint:
  name: Bambu Lab - Third-party chamber heater control
  author: pleasantone
  description: >
    Runs a bolt-on chamber heater (BambuSauna and friends) on a smart plug or relay for
    high-temperature prints, and makes sure it's off whenever the printer isn't actually printing.


    **This is not a safety device.** Your heater needs its own thermostat or thermal fuse. Pair
    this with the *Chamber over-temperature safety* blueprint as a second layer, not as a
    replacement.


    **On:** the bed target goes above the threshold (90 °C-ish means ABS/ASA territory) and the
    chamber is still below the "don't start above" temperature. It also turns on if the chamber
    sensor is unavailable at that moment.


    **Off**, whichever comes first:

    - the print ends (finish / failed / idle), from any state, so a cancel during prepare or
    while paused counts too

    - the bed target drops below the "off" threshold (a manual preheat you turned off)

    - the heater has been on for 75 minutes (default) with the printer idle/finished/failed.
    That leaves room to heat-soak the chamber before starting a print, and still catches a
    manual preheat you forgot about

    - the printer has been **offline or unavailable for an hour**. A printer that drops off
    the network mid-print keeps printing, so a shorter window would cool the chamber under a
    live print. A network drop never counts as "not printing" for the other exits.


    **Optional device auto-off keepalive:** if your plug or relay has its own auto-off timer
    (Shelly calls it "Automatic OFF"), set that to something short like 30 minutes and turn
    this on. While the heater is on, this re-sends "on" every few minutes, which restarts the
    device's timer. If HA goes down, hangs, or this automation is turned off, the heater
    switches itself off when the device timer runs out. List your over-temperature automation
    under "Only while these are on" and turning that one off stops the heater too. Check
    that your device restarts its timer on a repeated "on" (Shelly Gen2+ does) before relying
    on it.
  domain: automation
  source_url: https://github.com/pleasantone/ha-bambulab-blueprints/blob/main/blueprints/automation/pleasantone/bambu_chamber_heater.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    printer_section:
      name: Printer
      icon: mdi:printer-3d
      input:
        print_status:
          name: Print status
          description: The printer's print status sensor (`sensor.<printer>_print_status`).
          selector:
            entity:
              filter:
                - domain: sensor
        bed_target:
          name: Bed target temperature
          description: "`sensor.<printer>_bed_target_temperature`"
          selector:
            entity:
              filter:
                - domain: sensor
        chamber_temp:
          name: Chamber temperature
          description: "`sensor.<printer>_chamber_temperature`"
          selector:
            entity:
              filter:
                - domain: sensor
    heater_section:
      name: Heater
      icon: mdi:heat-wave
      input:
        heater:
          name: Heater switch
          selector:
            entity:
              filter:
                - domain:
                    - switch
                    - input_boolean
        on_bed_target:
          name: Turn on when the bed target goes above
          default: 89
          selector:
            number: {min: 40, max: 130, step: 1, unit_of_measurement: °C, mode: box}
        max_start_chamber:
          name: Don't start above this chamber temperature
          default: 55
          selector:
            number: {min: 20, max: 80, step: 1, unit_of_measurement: °C, mode: box}
        off_bed_target:
          name: Turn off when the bed target drops below
          default: 60
          selector:
            number: {min: 0, max: 120, step: 1, unit_of_measurement: °C, mode: box}
    timing_section:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        end_delay:
          name: Delay after the print ends
          default: {hours: 0, minutes: 1, seconds: 0}
          selector:
            duration: {}
        idle_backstop:
          name: Off if on this long with the printer idle
          description: >-
            Counts from when the heater turns on. Set it longer than your usual pre-print heat
            soak, or the heater will switch off before you start the print.
          default: {hours: 1, minutes: 15, seconds: 0}
          selector:
            duration: {}
        offline_grace:
          name: Off if the printer is offline/unavailable this long
          default: {hours: 1, minutes: 0, seconds: 0}
          selector:
            duration: {}
    keepalive_section:
      name: Device auto-off keepalive (optional)
      icon: mdi:timer-refresh-outline
      collapsed: true
      input:
        keepalive:
          name: Keep the device's auto-off timer from running out while the heater is on
          description: >-
            Only for a plug or relay with its own auto-off timer set. Without one this does
            nothing useful. Without HA, the heater turns off when that timer runs out, so make
            it longer than the interval below plus a restart, and never longer than you'd
            trust the heater to run unwatched.
          default: false
          selector:
            boolean: {}
        keepalive_every:
          name: Re-send "on" every
          default: "/10"
          selector:
            select:
              options:
                - {label: 5 minutes, value: "/5"}
                - {label: 10 minutes, value: "/10"}
                - {label: 15 minutes, value: "/15"}
        keepalive_requires:
          name: Only while these are on
          description: >-
            Automations that must be enabled for the keepalive to run, such as your chamber
            over-temperature safety. Turn one off and the device timer is allowed to run out.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: automation

mode: single

variables:
  heater_entity: !input heater
  chamber_entity: !input chamber_temp
  max_start_chamber: !input max_start_chamber
  keepalive_requires: !input keepalive_requires

triggers:
  - trigger: numeric_state
    entity_id: !input bed_target
    above: !input on_bed_target
    id: "on"
  - trigger: state
    entity_id: !input print_status
    to: [finish, failed, idle]
    for: !input end_delay
    id: print_ended
  - trigger: state
    entity_id: !input print_status
    to: [offline, unavailable]
    for: !input offline_grace
    id: offline
  - trigger: numeric_state
    entity_id: !input bed_target
    below: !input off_bed_target
    for: !input end_delay
    id: bed_target_low
  - trigger: state
    entity_id: !input heater
    to: "on"
    for: !input idle_backstop
    id: on_without_print
  - trigger: time_pattern
    minutes: !input keepalive_every
    id: keepalive
    enabled: !input keepalive

actions:
  - choose:
      - alias: Turn on for a hot print
        conditions:
          - condition: trigger
            id: "on"
          - condition: template
            value_template: >-
              {{ not is_number(states(chamber_entity))
                 or states(chamber_entity) | float < max_start_chamber }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input heater
          - action: logbook.log
            data:
              name: Chamber heater
              message: "Turned on: bed target above threshold, chamber {{ states(chamber_entity) }}"
              entity_id: "{{ heater_entity }}"

      - alias: Turn off - the printer is genuinely not printing
        conditions:
          - condition: state
            entity_id: !input heater
            state: "on"
          - condition: or
            conditions:
              # Offline/unavailable only turns the heater off through its own long timer.
              - condition: trigger
                id: offline
              - condition: state
                entity_id: !input print_status
                state: [finish, failed, idle]
          - condition: trigger
            id: [print_ended, offline, bed_target_low, on_without_print]
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input heater
          - action: logbook.log
            data:
              name: Chamber heater
              message: "Turned off ({{ trigger.id }})"
              entity_id: "{{ heater_entity }}"

      - alias: Keepalive - restart the device's own auto-off timer
        conditions:
          - condition: trigger
            id: keepalive
          - condition: state
            entity_id: !input heater
            state: "on"
          # A template because the list may be empty (state conditions need an entity).
          - condition: template
            value_template: >-
              {% set req = [keepalive_requires] if keepalive_requires is string
                 else keepalive_requires %}
              {{ req | reject('is_state', 'on') | list | count == 0 }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input heater
