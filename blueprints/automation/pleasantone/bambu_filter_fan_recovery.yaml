blueprint:
  name: Bambu Lab - Dropout recovery (fan, heater, anything on a plug)
  author: pleasantone
  description: >
    Puts a printer accessory back on if it drops off the network mid-print and comes back
    **off**: a filter fan like a Bento Box, a chamber heater, an exhaust, anything on a smart
    plug or relay.


    Wi-Fi plugs, relays and ESPHome devices often come back from `unavailable` as `off`. The
    automations that switch these on usually do it once, when the print starts or the tray
    changes, so one blip mid-print can leave the rest of an ABS print unfiltered or unheated.


    This only restores the device if it was **on** when it dropped out, and only if the printer
    is still printing when it comes back. It never decides on its own that the device should
    run; that stays with whatever turned it on in the first place, and so does turning it off.
    Use one automation per device.
  domain: automation
  source_url: https://github.com/pleasantone/ha-bambulab-blueprints/blob/main/blueprints/automation/pleasantone/bambu_filter_fan_recovery.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    filter_fan:
      name: Device to restore
      description: The fan or switch to put back on. (The input is still called `filter_fan` so existing automations keep working.)
      selector:
        entity:
          filter:
            - domain:
                - fan
                - switch
    print_status:
      name: Print status
      description: The printer's print status sensor (`sensor.<printer>_print_status`).
      selector:
        entity:
          filter:
            - domain: sensor
    give_up_after:
      name: Give up if it stays unavailable longer than
      default: {hours: 1, minutes: 0, seconds: 0}
      selector:
        duration: {}

mode: single
max_exceeded: silent

variables:
  fan_entity: !input filter_fan
  status_entity: !input print_status

triggers:
  - trigger: state
    entity_id: !input filter_fan
    from: "on"
    to: unavailable

actions:
  - alias: Wait for it to come back
    wait_for_trigger:
      - trigger: state
        entity_id: !input filter_fan
        from: unavailable
        to: ["on", "off"]
    timeout: !input give_up_after
    continue_on_timeout: false
  - alias: Came back off, while still printing
    condition: template
    value_template: >-
      {{ is_state(fan_entity, 'off')
         and states(status_entity) in ['prepare', 'running', 'pause'] }}
  - action: homeassistant.turn_on
    target:
      entity_id: !input filter_fan
  - action: logbook.log
    data:
      name: Dropout recovery
      message: "Came back off after a dropout mid-print; turned it back on"
      entity_id: "{{ fan_entity }}"
