blueprint:
  name: Bambu Lab - Auto power-down
  author: pleasantone
  description: >
    Cuts power to an idle printer through its smart plug, after a warning.


    It powers down once the printer has been idle for a while (4 hours by default) **and** is
    drawing idle-level power. It warns you first, waits, then checks everything again before
    cutting power, so a print started during the warning doesn't get killed in prepare.


    Optional **mode** (an `input_select`), so you can pick per printer from a dashboard:

    - **When print ends**: off a while (10 min by default) after a print finishes or fails, after the usual warning.
    The idle-time rule still applies too, so a printer you switched on and never used still
    goes off.

    - **After idle time**: the idle-time rule only.

    - **Stay on**: never.

    Leave the mode empty and it behaves as before (idle time only).


    **Restart-safe timing** (optional, recommended): give it an `input_datetime` helper (date and
    time) and it stores when the printer went idle instead of relying on a running timer. Plain
    "idle for 4 h" timers start over on every Home Assistant restart or automation reload; with
    the helper, a restart doesn't reset the clock, and a deadline that passed while Home Assistant
    was down is acted on once it's back (still with the warning first). An idle-since more than 3x
    the idle time old is treated as unset (a fresh helper, or days on "stay on") and restarts the
    clock instead of cutting power.


    Safety checks:

    - **Power sensor unreadable?** It notifies and leaves the printer on. An unavailable power
    sensor never counts as idle.

    - **AMS drying?** Give it the drying binary sensors and it won't cut power while any of them
    is on, or unknown. It checks both before the warning and after it.

    - **Optional kill switch**: an `input_boolean` that has to be on for power-down to happen.
    Works alongside the mode; both have to allow it.


    Set the idle-power threshold for your printer. Measure its idle draw on your plug's meter
    and pick something comfortably above it but well below printing power. Mine: X1C idles
    ~11 W (threshold 20 W), H2C idles 20-36 W depending on the airduct (threshold 45 W).
  domain: automation
  source_url: https://github.com/pleasantone/ha-bambulab-blueprints/blob/main/blueprints/automation/pleasantone/bambu_auto_power_down.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    printer_section:
      name: Printer
      icon: mdi:printer-3d
      input:
        current_stage:
          name: Current stage
          description: The printer's current stage sensor (`sensor.<printer>_current_stage`).
          selector:
            entity:
              filter:
                - domain: sensor
        plug:
          name: Smart plug
          description: The switch that powers the printer.
          selector:
            entity:
              filter:
                - domain: switch
        power_sensor:
          name: Power sensor
          description: The plug's power reading, in watts.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        idle_power:
          name: Idle power threshold
          description: Only power down while the printer draws less than this.
          default: 20
          selector:
            number: {min: 1, max: 500, step: 1, unit_of_measurement: W, mode: box}
        drying_sensors:
          name: AMS drying sensors (optional)
          description: >
            Every AMS drying binary sensor on this printer. Power-down only happens while all of
            them are `off`. Include the AMS units with their own power supply too: they still
            need the printer on to dry.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        print_status:
          name: Print status (optional)
          description: >
            The printer's print status sensor (`sensor.<printer>_print_status`). Only needed for
            the "when print ends" mode. ha-bambulab holds it at `finish` (or `failed`) after a print
            until the next one starts, and reads `idle` after a power-on, so switching the printer
            on doesn't count as a print ending.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    mode_section:
      name: Mode (optional)
      icon: mdi:power-settings
      collapsed: true
      input:
        mode_entity:
          name: Mode selector
          description: >
            An `input_select` whose options include the three option names below. Leave empty to
            always use the idle-time rule.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_select
        mode_after_print:
          name: '"When print ends" option'
          description: The option name that means "power off after a print ends".
          default: When print ends
          selector:
            text: {}
        mode_after_idle:
          name: '"After idle time" option'
          description: The option name that means "power off after the idle time only".
          default: After idle time
          selector:
            text: {}
        mode_never:
          name: '"Stay on" option'
          description: The option name that means "never power off automatically".
          default: Stay on
          selector:
            text: {}
        after_print_time:
          name: Time after a print
          description: >
            In "when print ends" mode, how long after the print finishes. Leaves time to grab the
            plate or queue another print. Picking the mode on a printer that finished a while ago
            starts this timer from then.
          default: {hours: 0, minutes: 10, seconds: 0}
          selector:
            duration: {}
    timing_section:
      name: Timing
      icon: mdi:timer-outline
      input:
        idle_time:
          name: Idle time
          description: How long the printer has to be idle first (any mode except "stay on").
          default: {hours: 4, minutes: 0, seconds: 0}
          selector:
            duration: {}
        warning_time:
          name: Warning time
          description: Time between the warning and cutting power.
          default: {hours: 0, minutes: 2, seconds: 0}
          selector:
            duration: {}
        idle_since:
          name: Idle-since helper (optional, recommended)
          description: >
            An `input_datetime` with date and time. The automation writes the moment the printer
            went idle (a print ending, or the plug being switched on) and counts from there, so
            Home Assistant restarts don't reset the idle clock. Leave empty for the old behavior.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        end_time_sensor:
          name: Print end time (optional)
          description: >
            The printer's end time sensor (`sensor.<printer>_end_time`). Only used with the
            idle-since helper: if a print finished while Home Assistant was down, the clock counts
            from whichever is newer, the stored idle time or the print's end.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        enable_toggle:
          name: Enable toggle (optional)
          description: An input_boolean that must be on for power-down to happen.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
    notify_section:
      name: Notifications
      icon: mdi:bell
      input:
        notify_action:
          name: Notification action
          description: >
            Runs for the warning and for the skip/cancel cases. These variables are available:
            `notify_title`, `notify_message`, `notify_tag` (one per plug, so a newer power
            notification replaces the older one), `notify_event` (`warning`, `skipped` or
            `cancelled`).
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  print_status_entity: !input print_status
  mode_entity: !input mode_entity
  mode_after_print: !input mode_after_print
  stage_tv: !input current_stage
  idle_since_entity: !input idle_since
  end_entity: !input end_time_sensor
  idle_time_v: !input idle_time
  after_print_v: !input after_print_time

variables:
  stage_entity: !input current_stage
  plug_entity: !input plug
  power_entity: !input power_sensor
  idle_power: !input idle_power
  drying: !input drying_sensors
  toggle_entity: !input enable_toggle
  status_entity: !input print_status
  mode_select: !input mode_entity
  mode_never: !input mode_never
  warning_time: !input warning_time
  notify_tag: "power_{{ plug_entity.split('.')[1] }}"
  warning_text: >-
    {% set s = (warning_time.hours | default(0)) * 3600 + (warning_time.minutes | default(0)) * 60
               + (warning_time.seconds | default(0)) %}
    {{- s ~ ' s' if s < 60 else ((s / 60) | round(1) | string | replace('.0', '')) ~ ' min' }}
  # Restart-safe timing: when the printer went idle, from the helper or the print's end time.
  idle_since_ts: >-
    {% if idle_since_entity == '' %}0{% else %}
    {%- set m = state_attr(idle_since_entity, 'timestamp') | float(0) -%}
    {%- set e = as_timestamp(states(end_entity), 0) if end_entity != '' else 0 -%}
    {{- [m, e if e <= as_timestamp(now()) else 0] | max -}}{% endif %}
  after_print_due: >-
    {% set ap = (after_print_v.hours | default(0)) * 3600 + (after_print_v.minutes | default(0)) * 60
                + (after_print_v.seconds | default(0)) %}
    {{ idle_since_ts | float(0) > 0 and mode_entity != '' and print_status_entity != ''
       and states(mode_entity) == mode_after_print
       and states(print_status_entity) in ['finish', 'failed']
       and as_timestamp(now()) - idle_since_ts | float(0) >= ap }}
  idle_seconds: >-
    {{ (idle_time_v.hours | default(0)) * 3600 + (idle_time_v.minutes | default(0)) * 60
       + (idle_time_v.seconds | default(0)) }}
  idle_due: >-
    {{ idle_since_ts | float(0) > 0 and as_timestamp(now()) - idle_since_ts | float(0) >= idle_seconds | float(0) }}
  # An idle-since more than 3x the idle time old can't be real (the printer would have been
  # powered down long ago): it's a fresh helper, or the mode was "stay on" for days.
  idle_since_stale: >-
    {{ idle_since_entity != '' and idle_since_ts | float(0) > 0
       and as_timestamp(now()) - idle_since_ts | float(0) > 3 * idle_seconds | float(0) }}
  why: >-
    {% if trigger.id == 'print_ended' %}print_ended
    {%- elif trigger.id in ['due', 'start'] and after_print_due and not idle_due %}print_ended
    {%- else %}idle{% endif %}

triggers:
  # Legacy timers, used only when no idle-since helper is configured.
  - id: idle
    trigger: state
    entity_id: !input current_stage
    to: idle
    for: !input idle_time
  - id: print_ended
    trigger: template
    value_template: >-
      {{ mode_entity != '' and print_status_entity != ''
         and states(mode_entity) == mode_after_print
         and states(print_status_entity) in ['finish', 'failed'] }}
    for: !input after_print_time
  # Restart-safe timing: record when the printer went idle...
  - id: mark_idle
    trigger: state
    entity_id: !input current_stage
    not_from: [idle, unavailable, unknown, offline]
    to: idle
  - id: mark_power_on
    trigger: state
    entity_id: !input plug
    from: "off"
    to: "on"
  # ...and check every minute whether the deadline has passed.
  - id: due
    trigger: template
    value_template: >-
      {%- if idle_since_entity == '' -%}false{%- else -%}
      {%- set now_ts = as_timestamp(now()) -%}
      {%- set m = state_attr(idle_since_entity, 'timestamp') | float(0) -%}
      {%- set e = as_timestamp(states(end_entity), 0) if end_entity != '' else 0 -%}
      {%- set since = [m, e if e <= now_ts else 0] | max -%}
      {%- set it = (idle_time_v.hours | default(0)) * 3600 + (idle_time_v.minutes | default(0)) * 60 + (idle_time_v.seconds | default(0)) -%}
      {%- set ap = (after_print_v.hours | default(0)) * 3600 + (after_print_v.minutes | default(0)) * 60 + (after_print_v.seconds | default(0)) -%}
      {%- set after_print = mode_entity != '' and print_status_entity != '' and states(mode_entity) == mode_after_print and states(print_status_entity) in ['finish', 'failed'] -%}
      {{ since > 0 and is_state(stage_tv, 'idle') and (now_ts - since >= it or (after_print and now_ts - since >= ap)) }}
      {%- endif -%}
  # A deadline can pass while Home Assistant is down; check again at start and after reloads.
  - id: start
    trigger: homeassistant
    event: start
  - id: start
    trigger: event
    event_type: automation_reloaded

actions:
  - alias: Record when the printer went idle (restart-safe timing)
    if:
      - condition: trigger
        id: [mark_idle, mark_power_on]
    then:
      - if:
          - condition: template
            value_template: "{{ idle_since_entity != '' }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ idle_since_entity }}"
            data:
              timestamp: "{{ as_timestamp(now()) }}"
      - stop: Recorded the idle start

  - alias: With an idle-since helper, the legacy timers are ignored
    if:
      - condition: trigger
        id: [idle, print_ended]
      - condition: template
        value_template: "{{ idle_since_entity != '' }}"
    then:
      - stop: Restart-safe timing is in use

  - alias: At start or reload, only continue if a deadline has passed
    if:
      - condition: trigger
        id: start
      - condition: template
        value_template: >-
          {{ idle_since_entity == '' or not is_state(stage_entity, 'idle')
             or not (idle_due or after_print_due) }}
    then:
      - stop: Nothing due

  - alias: A stale idle-since restarts the clock instead of cutting power
    if:
      - condition: trigger
        id: [due, start]
      - condition: template
        value_template: "{{ idle_since_stale }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ idle_since_entity }}"
        data:
          timestamp: "{{ as_timestamp(now()) }}"
      - stop: Idle-since was stale; restarted the clock

  - alias: Mode isn't "stay on" (or no mode configured)
    condition: template
    value_template: "{{ not mode_select or states(mode_select) != mode_never }}"
  - alias: Enable toggle on (or none configured)
    condition: template
    value_template: "{{ not toggle_entity or is_state(toggle_entity, 'on') }}"
  - alias: No AMS drying (unknown/unavailable also blocks)
    condition: template
    value_template: "{{ drying | reject('is_state', 'off') | list | count == 0 }}"

  - alias: "Guard: power unreadable - notify, never silently skip"
    if:
      - condition: template
        value_template: "{{ not is_number(states(power_entity)) }}"
    then:
      - variables:
          notify_event: skipped
          notify_title: Auto power-down skipped
          notify_message: >-
            Power sensor {{ power_entity }} reads '{{ states(power_entity) }}', so I can't
            confirm the printer is idle. Left it on.
      - choose: []
        default: !input notify_action
      - stop: Power reading unavailable

  - alias: Idle power check
    condition: template
    value_template: "{{ states(power_entity) | float < idle_power }}"

  - variables:
      notify_event: warning
      notify_title: Auto power-down
      notify_message: >-
        {%- set since = idle_since_ts | float(0) -%}
        {%- if since > 0 -%}
        {%- set ago = relative_time(as_datetime(since)) -%}
        {{ ('Print ended ' ~ ago ~ ' ago.') if why == 'print_ended' else ('Printer has been idle for ' ~ ago ~ '.') }}
        {%- elif why == 'print_ended' -%}
        Print ended {{ relative_time(states[status_entity].last_changed) }} ago.
        {%- else -%}
        Printer has been idle for {{ relative_time(states[stage_entity].last_changed) }}.
        {%- endif %} Powering down in {{ warning_text }} to save energy.
  - choose: []
    default: !input notify_action

  - delay: !input warning_time

  - alias: Re-check everything after the warning (a print or dry cycle may have started)
    if:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ drying | reject('is_state', 'off') | list | count > 0 }}"
          - condition: template
            value_template: "{{ not is_state(stage_entity, 'idle') }}"
          - condition: template
            value_template: "{{ mode_select != '' and is_state(mode_select, mode_never) }}"
          - condition: template
            value_template: "{{ toggle_entity != '' and not is_state(toggle_entity, 'on') }}"
          - condition: template
            value_template: >-
              {{ not is_number(states(power_entity)) or states(power_entity) | float >= idle_power }}
    then:
      - variables:
          notify_event: cancelled
          notify_title: Auto power-down cancelled
          notify_message: >-
            {% if (mode_select != '' and is_state(mode_select, mode_never))
                  or (toggle_entity != '' and not is_state(toggle_entity, 'on')) -%}
            Auto power-down was switched off during the warning. Left it on.
            {%- else -%}
            The printer became active during the warning (stage '{{ states(stage_entity) }}',
            {{ states(power_entity) }} W{{ ', AMS drying' if drying | reject('is_state', 'off')
            | list | count > 0 else '' }}). Left it on.
            {%- endif %}
      - choose: []
        default: !input notify_action
      - stop: Cancelled during the warning

  - action: switch.turn_off
    target:
      entity_id: !input plug
  - action: logbook.log
    data:
      name: Auto power-down
      message: >-
        {{ 'Printer powered off after its print ended' if why == 'print_ended'
           else 'Printer powered off after being idle' }} (energy saving)
      entity_id: "{{ plug_entity }}"
